[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-sampling-framework"
version = "0.1.0"
description = "A small, extensible DDPM training and sampling baseline."
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "torchvision>=0.15", "Pillow>=9.0"]

[project.optional-dependencies]
pretrained = ["diffusers>=0.30", "safetensors>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]
